<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training — Phishing Awareness</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="dashboard.html">Dashboard</a>
    <span class="user" id="navUser"></span>
    <a href="index.html" id="logoutLink">Log out</a>
  </nav>

  <div class="container">
    <div class="training-header">
      <h1>Intercepted message</h1>
      <p>Read the transmission below. Classify it as phishing or legitimate.</p>
      <span class="training-progress" id="trainingProgress" aria-live="polite">—</span>
    </div>

    <div id="noEmails" class="empty-state hidden">
      <p>No more messages to classify. Check your dashboard for results.</p>
      <a href="dashboard.html" class="btn btn-primary">Back to dashboard</a>
    </div>

    <div id="emailSection" class="hidden">
      <div class="transmission">
        <div class="transmission-label">Message</div>
        <div class="email-header">
          <span class="label">From:</span> <span id="emailSender"></span>
        </div>
        <div class="email-subject" id="emailSubject"></div>
        <div class="email-body" id="emailBody"></div>
      </div>

      <p class="decision-label" id="actionsLabel">Verdict</p>
      <div class="decision-zones">
        <button type="button" class="decision-zone decision-zone--phish" id="btnPhishing" aria-label="Mark as Phishing">Phishing</button>
        <button type="button" class="decision-zone decision-zone--safe" id="btnNotPhishing" aria-label="Mark as Legitimate">Legitimate</button>
      </div>

      <div id="feedback" class="result-feedback hidden"></div>

      <div class="training-next-wrap">
        <button type="button" class="btn btn-secondary hidden" id="btnNext">Next message</button>
      </div>
    </div>

    <div id="loading" class="empty-state">
      <p>Loading...</p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/training.js?v=3"></script>
</body>
</html>
