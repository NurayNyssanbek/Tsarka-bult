[phases.setup]
# Устанавливаем Python и pip через пакеты nix
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
# Используем pip напрямую, так как мы его установили выше
cmds = ["pip install -r backend/requirements.txt"]

[start]
# Заходим в папку и запускаем uvicorn
cmd = "cd backend && uvicorn main:app --host 0.0.0.0 --port ${PORT}"