[phases.setup]
nixPkgs = ["(python310.withPackages (ps: [ps.pip]))"]

[phases.install]
# Добавил 'ls -R', чтобы в логах увидеть все файлы
cmds = ["ls -R", "cd backend && python3 -m pip install -r requirements.txt"]

[start]
cmd = "cd backend && python3 -m uvicorn main:app --host 0.0.0.0 --port ${PORT}"