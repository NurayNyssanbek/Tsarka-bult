[phases.setup]
# Это самый стабильный способ объявить Python в Nixpacks
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
# Добавляем флаг, который мы обсуждали — без него Nix не даст записать файлы
cmds = ["pip install --break-system-packages -r backend/requirements.txt"]

[phases.build]
# Гарантируем, что Python увидит модули
cmds = ["touch backend/__init__.py"]

[start]
# Используем запуск модуля, это надежнее чем просто uvicorn
cmd = "cd backend && python3 -m uvicorn main:app --host 0.0.0.0 --port ${PORT}"