[phases.setup]
nixPkgs = ["(python310.withPackages (ps: [ps.pip]))"]

[phases.install]
cmds = ["python3 -m pip install -r backend/requirements.txt"]

[start]
# Сначала заходим в папку backend, чтобы пути к JSON и БД внутри кода сработали правильно
cmd = "cd backend && uvicorn main:app --host 0.0.0.0 --port ${PORT}"